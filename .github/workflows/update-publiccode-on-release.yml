name: Update publiccode.yml on release

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-publiccode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false

      - name: Extract release version and date
        id: release
        run: |
          RAW_VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${RAW_VERSION#v}"   # strip leading 'v'
          RELEASE_DATE=$(date -u +"%Y-%m-%d")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$RELEASE_DATE" >> "$GITHUB_OUTPUT"

      - name: Update publiccode.yml
        run: |
          sed -i "s/^softwareVersion:.*/softwareVersion: \"${VERSION}\"/" publiccode.yml
          sed -i "s/^releaseDate:.*/releaseDate: \"${RELEASE_DATE}\"/" publiccode.yml
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_DATE: ${{ steps.release.outputs.date }}

      - name: Create PR with the update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: "publiccode.yml"
          commit-message: "Update publiccode.yml to version ${{ steps.release.outputs.version }}"
          title: "Update publiccode.yml to version ${{ steps.release.outputs.version }}"
          labels: "publiccode"
          body: |
            Update publiccode.yml to version ${{ steps.release.outputs.version }}

            ## Automated Update
            This PR was automatically generated by the "update publiccode.yml on release" workflow.
          branch: "update-publiccode"
