name: CI

on:
  push:
    branches:
      - develop
      - "[0-9].x"
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

env:
  PHP_VERSION: 8.5

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432

      mariadb:
        image: mariadb:11
        ports:
          - 3306
        env:
          MARIADB_USER: user
          MARIADB_PASSWORD: password
          MARIADB_DATABASE: test
          MARIADB_ROOT_PASSWORD: password
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify MariaDB connection
        env:
          PORT: ${{ job.services.mariadb.ports[3306] }}
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"$PORT" --silent; do
            sleep 1
          done
      - name: Verify Postgres connection
        env:
          PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          while ! pg_isready -h"127.0.0.1" -p"$PORT" > /dev/null 2> /dev/null; do
            sleep 1
          done
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install pv mariadb-client
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, fileinfo, json, mbstring, dom, ldap, pdo, tokenizer, xml, mysql, sqlite, imagick, exif, intl
          coverage: pcov
      - name: Copy .env
        run: php -r "copy('.env.ci', '.env');"
      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Install php dependencies
        run: |
          composer self-update
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Generate key
        run: php artisan key:generate
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Migrate Database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mariadb.ports[3306] }}
          DB_DATABASE: test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --no-interaction -vvv --force
      - name: Execute code style check via Laravel Pint
        run: vendor/bin/pint --test -v
      - name: Execute tests (Unit and Feature tests) via PHPUnit
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mariadb.ports[3306] }}
          DB_DATABASE: test
          DB_USERNAME: root
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: ${{ job.services.redis.ports[6379] }}
          LOG_CHANNEL: stack
        run: php artisan test --parallel --testsuite=Unit,Feature --coverage-clover=coverage.xml
      - name: Execute tests (Unit, Feature and Integration tests) via PHPUnit
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mariadb.ports[3306] }}
          DB_DATABASE: test
          DB_USERNAME: root
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: ${{ job.services.redis.ports[6379] }}
          LOG_CHANNEL: stack
          BBB_TEST_SERVER_HOST: ${{ secrets.BBB_TEST_SERVER_HOST }}
          BBB_TEST_SERVER_SECRET: ${{ secrets.BBB_TEST_SERVER_SECRET }}
        run: php artisan test --parallel --coverage-clover=coverage.xml
      - name: Execute tests (Unit and Feature tests) via PHPUnit using Postgres
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_DATABASE: test
          DB_USERNAME: user
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: ${{ job.services.redis.ports[6379] }}
          LOG_CHANNEL: stack
        run: php artisan test --parallel --testsuite=Unit,Feature
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
      - name: Upload laravel logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: laravel-backend-tests.log
          path: storage/logs/laravel.log
          archive: false
  frontend-code-style-check:
    name: Frontend Code Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy .env
        run: php -r "copy('.env.example', '.env');"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ./package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check code formatting
        run: npm run prettier
      - name: Linting
        run: npm run lint
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and export
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: docker/app/Dockerfile
          context: .
          load: true
          tags: pilos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/pilos-image.tar
          build-args: |
            VITE_COVERAGE=true
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilos-image.tar
          path: /tmp/pilos-image.tar
          archive: false
  generate-frontend-matrix:
    name: Generate Frontend Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: generate-matrix
        run: |
          if [ ${{ (github.actor == 'dependabot[bot]' || github.event_name == 'push') && runner.debug != '1' }} = true ]; then
              matrix='{ "containers": [1] }'
          else
              matrix='{ "containers": [1,2,3,4,5] }'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs:
      - docker-build
      - generate-frontend-matrix
    strategy:
      # don't fail the entire matrix on failure
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-frontend-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilos-image.tar
          path: /tmp
      - name: Load image
        run: |
          docker load --input /tmp/pilos-image.tar

      - name: Copy .env
        run: docker run --rm pilos:latest cat ./.env.ci > .env

      - name: Generate key
        run: |
          docker run --rm \
          --mount type=bind,source=${{ github.workspace }}/.env,target=/var/www/html/.env \
          --entrypoint /bin/bash \
          pilos:latest \
          -c "chown www-data:www-data .env && pilos-cli key:generate"

      - name: Adjust .env
        run: |
          sed -i 's/CONTAINER_IMAGE=.*/CONTAINER_IMAGE=pilos:latest/g' .env
          sed -i 's|APP_URL=.*|APP_URL=http://localhost:9080|g' .env
          sed -i 's|BBB_TEST_SERVER_HOST=.*|BBB_TEST_SERVER_HOST=${{ secrets.BBB_TEST_SERVER_HOST }}|g' .env
          sed -i 's|BBB_TEST_SERVER_SECRET=.*|BBB_TEST_SERVER_SECRET=${{ secrets.BBB_TEST_SERVER_SECRET }}|g' .env

      - name: Start app
        run: docker compose -f compose.test.yml -f compose.test.ci.yml up -d
      - name: Install dependencies
        # Skip install scripts (e.g. the Cypress binary download), the browsers come from the Playwright image
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Wait for app
        run: timeout 120 sh -c 'until curl -sf -o /dev/null http://localhost:9080/; do sleep 2; done'
      - name: Playwright run frontend tests
        run: tools/playwright-docker.sh --project=frontend --shard=${{ matrix.containers }}/${{ strategy.job-total }}
        env:
          APP_URL: "http://localhost:9080"
          COVERAGE: "true"
      - name: Upload test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-frontend-report-${{ matrix.containers }}
          path: |
            playwright-report
            tests/Playwright/test-results
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          directory: coverage
  visual-tests:
    name: Visual Tests
    runs-on: ubuntu-latest
    needs:
      - docker-build
      - generate-frontend-matrix
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilos-image.tar
          path: /tmp
      - name: Load image
        run: |
          docker load --input /tmp/pilos-image.tar
      - name: Copy .env
        run: docker run --rm pilos:latest cat ./.env.ci > .env
      - name: Generate key
        run: |
          docker run --rm \
          --mount type=bind,source=${{ github.workspace }}/.env,target=/var/www/html/.env \
          --entrypoint /bin/bash \
          pilos:latest \
          -c "chown www-data:www-data .env && pilos-cli key:generate"

      - name: Adjust .env
        run: |
          sed -i 's/CONTAINER_IMAGE=.*/CONTAINER_IMAGE=pilos:latest/g' .env
          sed -i 's|APP_URL=.*|APP_URL=http://localhost:9080|g' .env
          sed -i 's|BBB_TEST_SERVER_HOST=.*|BBB_TEST_SERVER_HOST=${{ secrets.BBB_TEST_SERVER_HOST }}|g' .env
          sed -i 's|BBB_TEST_SERVER_SECRET=.*|BBB_TEST_SERVER_SECRET=${{ secrets.BBB_TEST_SERVER_SECRET }}|g' .env

      - name: Start app
        run: docker compose -f compose.test.yml -f compose.test.ci.yml up -d

      - name: Install dependencies
        # Skip install scripts (e.g. the Cypress binary download), the browsers come from the Playwright image
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Wait for app
        run: timeout 120 sh -c 'until curl -sf -o /dev/null http://localhost:9080/; do sleep 2; done'
      - name: Playwright run visual tests
        run: tools/playwright-docker.sh --project=visual
        env:
          APP_URL: "http://localhost:9080"
      - name: Upload visual test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-visual-results
          path: tests/Playwright/test-results
  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    needs:
      - docker-build
      - generate-frontend-matrix
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilos-image.tar
          path: /tmp
      - name: Load image
        run: |
          docker load --input /tmp/pilos-image.tar
          docker image ls -a

      - name: Copy .env
        run: docker run --rm pilos:latest cat ./.env.ci > .env

      - name: Generate key
        run: |
          docker run --rm \
          --mount type=bind,source=${{ github.workspace }}/.env,target=/var/www/html/.env \
          --entrypoint /bin/bash \
          pilos:latest \
          -c "chown www-data:www-data .env && pilos-cli key:generate"

      - name: Adjust .env
        run: |
          sed -i 's/CONTAINER_IMAGE=.*/CONTAINER_IMAGE=pilos:latest/g' .env
          sed -i 's|APP_URL=.*|APP_URL=http://localhost:9080|g' .env
          sed -i 's|BBB_TEST_SERVER_HOST=.*|BBB_TEST_SERVER_HOST=${{ secrets.BBB_TEST_SERVER_HOST }}|g' .env
          sed -i 's|BBB_TEST_SERVER_SECRET=.*|BBB_TEST_SERVER_SECRET=${{ secrets.BBB_TEST_SERVER_SECRET }}|g' .env

      - name: Start app
        run: docker compose -f compose.test.yml -f compose.test.ci.yml up -d

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright browsers
        # The system tests run on the host, because they call `docker compose exec` to reset the database
        run: npx playwright install --with-deps chromium
      - name: Wait for app
        run: timeout 120 sh -c 'until curl -sf -o /dev/null http://localhost:9080/; do sleep 2; done'
      - name: Playwright run system tests
        run: npm run playwright:run:system
        env:
          APP_URL: "http://localhost:9080"
      - name: Upload test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-system-report
          path: |
            playwright-report
            tests/Playwright/test-results
      - name: Upload laravel logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: laravel-system-tests.log
          path: storage/logs/laravel.log
          archive: false
