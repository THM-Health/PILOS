server {
    listen 80;

    include /etc/nginx/snippets/ssl*;

    root /var/www/html/public;

    # Internal file delivery via X-Accel-Redirect (e.g. recordings)
    location /private-storage/ {
        internal;
        alias /var/www/html/storage/;
    }

    # Room files (user uploads): must never be rendered as a document by the browser.
    # Content-Disposition: attachment is set by the application (RoomFileService).
    location ^~ /private-storage/app/ {
        internal;
        alias /var/www/html/storage/app/;
        include /etc/nginx/snippets/security-header.conf;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # Public disk (logos, pause images, styles, ...): force download and block any active content
    # if a file is opened directly. Embedding via <img> / <link> is not affected by these headers.
    location ^~ /storage/ {
        include /etc/nginx/snippets/security-header.conf;
        add_header Content-Disposition "attachment" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

        location ~ /\. {
            deny all;
        }

        try_files $uri =404;
    }

    include /etc/nginx/snippets/security-header.conf;

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    client_max_body_size 1G;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/ping$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        allow 127.0.0.1;
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }

    location /playback/presentation/playback.html {
        return 301 /playback/presentation/0.81/playback.html?$query_string;
    }

    location /playback/presentation/2.0/playback.html {
        return 301 /playback/presentation/2.3/$arg_meetingId?$query_string;
    }

    location /playback/presentation/2.3/ {
            alias /var/www/html/public/playback-player/;
            index index.html;
            try_files $uri $uri/ /playback/presentation/2.3/index.html;
    }

}
