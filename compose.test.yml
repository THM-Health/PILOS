name: pilos-ci

services:
  app:
    image: "${CONTAINER_IMAGE:-pilos/pilos:latest}"
    ports:
      - "9080:80"
    environment:
      # The array cache is not shared between requests, so rate limiters (e.g. login: 5 attempts per minute) never
      # throttle the system tests, which log in as the same users all the time
      CACHE_DRIVER: array
    sysctls:
      net.core.somaxconn: 65536
      net.ipv4.ip_local_port_range: "2000 65535"
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.tcp_fin_timeout: 30
    healthcheck:
      test: curl --fail http://localhost/ping || exit 1
      interval: 10s
      retries: 6
      timeout: 5s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: "mariadb:11"
    environment:
      MARIADB_DATABASE: "app"
      MARIADB_USER: "user"
      MARIADB_PASSWORD: "password"
      MARIADB_RANDOM_ROOT_PASSWORD: "true"
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 12
      timeout: 5s
  redis:
    image: redis:7.2-alpine3.18
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      retries: 12
      timeout: 5s
volumes:
  mariadb:
    driver: local
  redis:
    driver: local
